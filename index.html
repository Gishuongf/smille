<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AI Dental Studio — Примерка улыбки</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #08080c; color: #fff; overflow: hidden;
            width: 100vw; height: 100vh;
        }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; flex-direction: column; align-items: center; justify-content: center;
        }
        .screen.active { display: flex; }

        #welcome {
            background: radial-gradient(circle at center, #1e1b4b 0%, #08080c 80%);
            text-align: center; padding: 30px;
        }
        .hero-icon { font-size: 70px; margin-bottom: 20px; }
        .hero-title {
            font-size: 32px; font-weight: 800;
            background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }
        .hero-desc { font-size: 15px; color: #94a3b8; max-width: 320px; line-height: 1.6; margin-bottom: 40px; }
        .btn-primary {
            background: linear-gradient(135deg, #0284c7, #6366f1);
            border: none; color: white; padding: 18px 50px; border-radius: 35px;
            font-size: 17px; font-weight: 700; cursor: pointer;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
            transition: transform 0.2s;
        }
        .btn-primary:active { transform: scale(0.95); }

        #camera-screen { background: #000; }
        #webcam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .camera-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 40px 20px;
            pointer-events: none;
        }
        .guide-box { width: 260px; height: 330px; border: 2px dashed rgba(255,255,255,0.4); border-radius: 50%; margin-top: 20px; }
        .snap-btn {
            width: 80px; height: 80px; border-radius: 50%; background: white;
            border: 6px solid rgba(255,255,255,0.3); cursor: pointer; pointer-events: auto;
            transition: transform 0.2s;
        }
        .snap-btn:active { transform: scale(0.9); }

        #processing { background: #08080c; text-align: center; padding: 25px; }
        .ai-loader {
            width: 75px; height: 75px; border: 4px solid rgba(56, 189, 248, 0.2);
            border-top-color: #38bdf8; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 25px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #result { background: #08080c; padding: 20px; }
        .compare-box {
            position: relative; width: 330px; height: 330px; border-radius: 20px;
            overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.8); touch-action: none;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .compare-box canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        #canvas-after { clip-path: inset(0 0 0 50%); }
        .slider-line { position: absolute; top: 0; left: 50%; width: 2px; height: 100%; background: white; transform: translateX(-50%); z-index: 10; }
        .slider-button {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 38px; height: 38px; background: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: #000; font-weight: bold; font-size: 14px;
        }
        .tag { position: absolute; top: 14px; padding: 5px 12px; border-radius: 12px; background: rgba(0,0,0,0.65); font-size: 12px; font-weight: 700; z-index: 5; }
        .tag-before { left: 14px; }
        .tag-after { right: 14px; color: #38bdf8; }

        .btn-row { display: flex; gap: 12px; margin-top: 25px; }
        .btn-save { background: #22c55e; color: white; border: none; padding: 15px 30px; border-radius: 30px; font-weight: bold; cursor: pointer; }
        .btn-retry { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 15px 22px; border-radius: 30px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="screen active" id="welcome">
        <div class="hero-icon">🦷</div>
        <div class="hero-title">AI Smile Studio</div>
        <div class="hero-desc">Генерация идеальной анатомической улыбки с помощью серверной нейросети FLUX</div>
        <button class="btn-primary" onclick="startCamera()">Сделать фото</button>
    </div>

    <div class="screen" id="camera-screen">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="camera-overlay">
            <div style="background: rgba(0,0,0,0.7); padding: 8px 18px; border-radius: 20px; font-size: 14px;">Улыбнитесь в камеру 😊</div>
            <div class="guide-box"></div>
            <button class="snap-btn" onclick="captureAndSend()"></button>
        </div>
    </div>

    <div class="screen" id="processing">
        <div class="ai-loader"></div>
        <div style="font-size: 19px; font-weight: bold; margin-bottom: 8px;">Нейросеть FLUX генерирует зубы...</div>
        <div style="font-size: 13px; color: #94a3b8; max-width: 290px;" id="ai-status">Моделирование анатомических виниров E.max...</div>
    </div>

    <div class="screen" id="result">
        <div style="font-size: 20px; font-weight: bold; margin-bottom: 15px;">Результат нейросети</div>
        <div class="compare-box" id="compare-box">
            <canvas id="canvas-before"></canvas>
            <canvas id="canvas-after"></canvas>
            <div class="tag tag-before">ДО</div>
            <div class="tag tag-after">ПОСЛЕ (AI)</div>
            <div class="slider-line" id="slider-line"><div class="slider-button">⇔</div></div>
        </div>
        <div class="btn-row">
            <button class="btn-save" onclick="downloadResult()">💾 Сохранить</button>
            <button class="btn-retry" onclick="restart()">🔄 Еще раз</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        let cameraStream = null;

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        async function startCamera() {
            showScreen('camera-screen');
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 960 } }
                });
                video.srcObject = cameraStream;
                await video.play();
            } catch (e) {
                alert('Пожалуйста, разрешите доступ к камере.');
                showScreen('welcome');
            }
        }

        async function captureAndSend() {
            const snapCanvas = document.createElement('canvas');
            snapCanvas.width = 512;
            snapCanvas.height = 512;
            const ctx = snapCanvas.getContext('2d');
            ctx.translate(512, 0);
            ctx.scale(-1, 1);

            const minDim = Math.min(video.videoWidth, video.videoHeight);
            const sx = (video.videoWidth - minDim) / 2;
            const sy = (video.videoHeight - minDim) / 2;
            ctx.drawImage(video, sx, sy, minDim, minDim, 0, 0, 512, 512);

            if (cameraStream) {
                cameraStream.getTracks().forEach(t => t.stop());
            }

            showScreen('processing');

            const imageBase64 = snapCanvas.toDataURL('image/jpeg', 0.95);

            try {
                const res = await fetch('/api/makeover', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: imageBase64 })
                });

                if (!res.ok) {
                    throw new Error('Сбой обработки');
                }

                const resBlob = await res.blob();
                const img = new Image();
                img.src = URL.createObjectURL(resBlob);
                await img.decode();

                renderResult(snapCanvas, img);
            } catch (err) {
                console.error(err);
                alert("Ошибка: " + err.message);
                restart();
            }
        }

        function renderResult(beforeCanvas, afterImg) {
            showScreen('result');
            const cBefore = document.getElementById('canvas-before');
            const cAfter = document.getElementById('canvas-after');

            cBefore.width = 512; cBefore.height = 512;
            cBefore.getContext('2d').drawImage(beforeCanvas, 0, 0);

            cAfter.width = 512; cAfter.height = 512;
            cAfter.getContext('2d').drawImage(afterImg, 0, 0);

            setupSlider();
        }

        function setupSlider() {
            const box = document.getElementById('compare-box');
            const line = document.getElementById('slider-line');
            const cAfter = document.getElementById('canvas-after');

            function move(e) {
                const rect = box.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                let pos = (clientX - rect.left) / rect.width;
                pos = Math.max(0.02, Math.min(0.98, pos));
                line.style.left = `${pos * 100}%`;
                cAfter.style.clipPath = `inset(0 0 0 ${pos * 100}%)`;
            }

            box.addEventListener('mousemove', move);
            box.addEventListener('touchmove', move);
        }

        function downloadResult() {
            const cAfter = document.getElementById('canvas-after');
            const a = document.createElement('a');
            a.download = `smile-ai-${Date.now()}.jpg`;
            a.href = cAfter.toDataURL('image/jpeg', 0.95);
            a.click();
        }

        function restart() {
            showScreen('welcome');
        }
    </script>
</body>
</html>
