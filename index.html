<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AI Dental Studio — Генерация улыбки</title>

    <!-- MediaPipe FaceMesh для идеального выделения области рта -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #08080c;
            color: #fff;
            overflow: hidden;
            width: 100vw; height: 100vh;
        }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; flex-direction: column; align-items: center; justify-content: center;
        }
        .screen.active { display: flex; }

        /* Экран 1: Старт */
        #welcome {
            background: radial-gradient(circle at center, #1e1b4b 0%, #08080c 80%);
            text-align: center; padding: 30px;
        }
        .hero-icon { font-size: 70px; margin-bottom: 20px; }
        .hero-title {
            font-size: 32px; font-weight: 800;
            background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }
        .hero-desc {
            font-size: 15px; color: #94a3b8; max-width: 320px;
            line-height: 1.6; margin-bottom: 40px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #0284c7, #6366f1);
            border: none; color: white; padding: 18px 50px; border-radius: 35px;
            font-size: 17px; font-weight: 700; cursor: pointer;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
            transition: transform 0.2s;
        }
        .btn-primary:active { transform: scale(0.95); }

        /* Экран 2: Камера */
        #camera-screen { background: #000; }
        #webcam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .camera-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            align-items: center; justify-content: space-between; padding: 40px 20px;
        }
        .status-badge {
            background: rgba(0,0,0,0.75); backdrop-filter: blur(10px);
            padding: 10px 22px; border-radius: 25px; font-size: 15px;
            border: 1px solid rgba(255,255,255,0.15); transition: 0.3s;
        }
        .guide-box {
            width: 250px; height: 320px;
            border: 2px dashed rgba(255,255,255,0.35); border-radius: 50%;
            margin-top: 20px; transition: 0.3s;
        }
        .guide-box.active {
            border-color: #22c55e;
            box-shadow: 0 0 35px rgba(34, 197, 94, 0.35);
        }
        .snap-btn {
            width: 80px; height: 80px; border-radius: 50%; background: white;
            border: 6px solid rgba(255,255,255,0.3); cursor: pointer; pointer-events: auto;
            transition: 0.2s;
        }
        .snap-btn:active { transform: scale(0.9); }
        .snap-btn:disabled { opacity: 0.3; }

        /* Экран 3: Загрузка */
        #processing { background: #08080c; text-align: center; padding: 25px; }
        .ai-loader {
            width: 75px; height: 75px; border: 4px solid rgba(56, 189, 248, 0.2);
            border-top-color: #38bdf8; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 25px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Экран 4: Слайдер До/После */
        #result { background: #08080c; padding: 20px; }
        .compare-box {
            position: relative; width: 340px; height: 340px;
            border-radius: 20px; overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            touch-action: none;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .compare-box canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;
        }
        #canvas-after { clip-path: inset(0 0 0 50%); }
        .slider-line {
            position: absolute; top: 0; left: 50%; width: 2px; height: 100%;
            background: white; transform: translateX(-50%); z-index: 10;
        }
        .slider-button {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 38px; height: 38px; background: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #000; font-weight: bold; font-size: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .tag {
            position: absolute; top: 14px; padding: 5px 12px; border-radius: 12px;
            background: rgba(0,0,0,0.65); font-size: 12px; font-weight: 700; z-index: 5;
            backdrop-filter: blur(5px);
        }
        .tag-before { left: 14px; }
        .tag-after { right: 14px; color: #38bdf8; }

        .btn-row { display: flex; gap: 12px; margin-top: 25px; }
        .btn-save {
            background: linear-gradient(135deg, #22c55e, #16a34a); color: white;
            border: none; padding: 15px 30px; border-radius: 30px;
            font-size: 15px; font-weight: bold; cursor: pointer;
            box-shadow: 0 8px 25px rgba(34, 197, 94, 0.3);
        }
        .btn-retry {
            background: rgba(255,255,255,0.1); color: white;
            border: 1px solid rgba(255,255,255,0.2); padding: 15px 22px;
            border-radius: 30px; font-size: 15px; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: СТАРТ -->
    <div class="screen active" id="welcome">
        <div class="hero-icon">🦷</div>
        <div class="hero-title">AI Smile Studio</div>
        <div class="hero-desc">
            Генерация анатомически идеальной улыбки с помощью нейросети Stable Diffusion
        </div>
        <button class="btn-primary" onclick="startCamera()">Сделать фото</button>
    </div>

    <!-- ЭКРАН 2: КАМЕРА -->
    <div class="screen" id="camera-screen">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="camera-overlay">
            <div class="status-badge" id="status-hint">Улыбнитесь в камеру 😊</div>
            <div class="guide-box" id="guide-box"></div>
            <button class="snap-btn" id="snap-btn" onclick="captureAndGenerate()" disabled></button>
        </div>
    </div>

    <!-- ЭКРАН 3: ЗАГРУЗКА -->
    <div class="screen" id="processing">
        <div class="ai-loader"></div>
        <div style="font-size: 19px; font-weight: bold; margin-bottom: 8px;">Нейросеть генерирует зубы...</div>
        <div style="font-size: 13px; color: #94a3b8; max-width: 290px; line-height: 1.5;" id="ai-status">
            Подключение к AI серверу Hugging Face...
        </div>
    </div>

    <!-- ЭКРАН 4: РЕЗУЛЬТАТ -->
    <div class="screen" id="result">
        <div style="font-size: 20px; font-weight: bold; margin-bottom: 15px;">Результат генерации AI</div>
        
        <div class="compare-box" id="compare-box">
            <canvas id="canvas-before"></canvas>
            <canvas id="canvas-after"></canvas>
            <div class="tag tag-before">ДО</div>
            <div class="tag tag-after">ПОСЛЕ (AI)</div>
            <div class="slider-line" id="slider-line">
                <div class="slider-button">⇔</div>
            </div>
        </div>

        <div class="btn-row">
            <button class="btn-save" onclick="downloadResult()">💾 Сохранить</button>
            <button class="btn-retry" onclick="restart()">🔄 Еще раз</button>
        </div>
    </div>

    <script>
        const HF_TOKEN = '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';

        const video = document.getElementById('webcam');
        let faceMesh = null;
        let lastLandmarks = null;
        let cameraStream = null;

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        async function startCamera() {
            showScreen('camera-screen');

            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 960 } }
                });
                video.srcObject = cameraStream;
                await video.play();
            } catch (e) {
                alert('Пожалуйста, разрешите доступ к камере.');
                showScreen('welcome');
                return;
            }

            faceMesh = new FaceMesh({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
            });
            faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5 });
            faceMesh.onResults(onFaceTracking);

            const cam = new Camera(video, {
                onFrame: async () => { await faceMesh.send({ image: video }); },
                width: 640, height: 480
            });
            cam.start();
        }

        function onFaceTracking(results) {
            const guide = document.getElementById('guide-box');
            const snapBtn = document.getElementById('snap-btn');
            const hint = document.getElementById('status-hint');

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                lastLandmarks = results.multiFaceLandmarks[0];
                guide.classList.add('active');
                snapBtn.disabled = false;
                hint.innerText = "Отлично! Сделайте снимок 📸";
                hint.style.borderColor = "#22c55e";
            } else {
                lastLandmarks = null;
                guide.classList.remove('active');
                snapBtn.disabled = true;
                hint.innerText = "Поместите лицо в центр";
                hint.style.borderColor = "rgba(255,255,255,0.15)";
            }
        }

        async function captureAndGenerate() {
            if (!lastLandmarks) return;

            // 1. Создаем стандартизированное фото 512x512 для Stable Diffusion
            const AI_SIZE = 512;
            const snapCanvas = document.createElement('canvas');
            snapCanvas.width = AI_SIZE;
            snapCanvas.height = AI_SIZE;
            const ctx = snapCanvas.getContext('2d');

            // Зеркалим изображение и кадрируем строго по центру
            ctx.translate(AI_SIZE, 0);
            ctx.scale(-1, 1);

            const minDim = Math.min(video.videoWidth, video.videoHeight);
            const sx = (video.videoWidth - minDim) / 2;
            const sy = (video.videoHeight - minDim) / 2;

            ctx.drawImage(video, sx, sy, minDim, minDim, 0, 0, AI_SIZE, AI_SIZE);

            // 2. Создаем точную маску рта 512x512
            const maskCanvas = generateMask512(AI_SIZE, AI_SIZE, lastLandmarks);

            // Останавливаем камеру
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
            }

            showScreen('processing');

            // 3. Отправляем в Hugging Face Stable Diffusion
            try {
                const aiResultImage = await callHuggingFaceAI(snapCanvas, maskCanvas);
                renderResult(snapCanvas, aiResultImage);
            } catch (err) {
                console.error(err);
                alert("Ошибка нейросети: " + err.message);
                restart();
            }
        }

        // Построение маски 512x512
        function generateMask512(width, height, landmarks) {
            const maskCanvas = document.createElement('canvas');
            maskCanvas.width = width;
            maskCanvas.height = height;
            const mCtx = maskCanvas.getContext('2d');

            // Черный фон = исходное лицо не изменяется
            mCtx.fillStyle = '#000000';
            mCtx.fillRect(0, 0, width, height);

            // Точки рта
            const mouthPoints = [78, 191, 80, 81, 82, 13, 312, 311, 310, 415, 308, 324, 318, 402, 317, 14, 87, 178, 88, 95];

            // Белая область = место, где нейросеть сгенерирует новые зубы
            mCtx.fillStyle = '#ffffff';
            mCtx.beginPath();
            const p0 = landmarks[mouthPoints[0]];
            mCtx.moveTo((1 - p0.x) * width, p0.y * height);

            for (let i = 1; i < mouthPoints.length; i++) {
                const p = landmarks[mouthPoints[i]];
                mCtx.lineTo((1 - p.x) * width, p.y * height);
            }
            mCtx.closePath();
            mCtx.fill();

            // Легкое размытие для идеальной бесшовности на губах
            mCtx.filter = 'blur(4px)';
            mCtx.drawImage(maskCanvas, 0, 0);

            return maskCanvas;
        }

        // Запрос к Hugging Face API Inpainting с ПОЛНЫМ DataURI
        async function callHuggingFaceAI(photoCanvas, maskCanvas) {
            const statusText = document.getElementById('ai-status');

            // ВАЖНО: передаем полный DataURL с префиксом data:image/jpeg;base64,
            // чтобы Python на сервере не искал несуществующий файл
            const imageURI = photoCanvas.toDataURL('image/jpeg', 0.95);
            const maskURI = maskCanvas.toDataURL('image/png');

            // Проверенная модель SD Inpainting на Hugging Face
            const MODEL_URL = "https://api-inference.huggingface.co/models/runwayml/stable-diffusion-inpainting";

            let attempts = 0;
            const maxAttempts = 6;

            while (attempts < maxAttempts) {
                attempts++;
                statusText.innerText = `Генерация улыбки нейросетью (запрос ${attempts}/${maxAttempts})...`;

                const response = await fetch(MODEL_URL, {
                    headers: {
                        "Authorization": `Bearer ${HF_TOKEN}`,
                        "Content-Type": "application/json"
                    },
                    method: "POST",
                    body: JSON.stringify({
                        inputs: {
                            image: imageURI,
                            mask_image: maskURI
                        },
                        parameters: {
                            prompt: "extreme close up of beautiful mouth with perfect straight white teeth, hollywood porcelain veneers, clean natural dental anatomy, symmetric teeth, dental photography, ultra realistic 8k",
                            negative_prompt: "toothless, missing teeth, dark empty mouth, crooked, yellow, braces, bad anatomy, deformed lips, blurry",
                            guidance_scale: 8.5
                        }
                    })
                });

                // Если модель спит (холодный старт сервера)
                if (response.status === 503) {
                    const data = await response.json();
                    const waitTime = Math.round(data.estimated_time || 15);
                    statusText.innerText = `AI-сервер просыпается... Ждем ${waitTime} сек.`;
                    await new Promise(r => setTimeout(r, waitTime * 1000));
                    continue;
                }

                if (!response.ok) {
                    const err = await response.json().catch(() => ({ error: response.statusText }));
                    throw new Error(err.error || `Ошибка сервера (${response.status})`);
                }

                const blob = await response.blob();
                const img = new Image();
                img.src = URL.createObjectURL(blob);
                await img.decode();
                return img;
            }

            throw new Error("Сервер перегружен. Попробуйте еще раз через 30 секунд.");
        }

        // Отрисовка слайдера
        function renderResult(beforeCanvas, afterImage) {
            showScreen('result');

            const cBefore = document.getElementById('canvas-before');
            const cAfter = document.getElementById('canvas-after');

            cBefore.width = 512;
            cBefore.height = 512;
            cBefore.getContext('2d').drawImage(beforeCanvas, 0, 0);

            cAfter.width = 512;
            cAfter.height = 512;
            cAfter.getContext('2d').drawImage(afterImage, 0, 0);

            setupSlider();
        }

        function setupSlider() {
            const box = document.getElementById('compare-box');
            const line = document.getElementById('slider-line');
            const cAfter = document.getElementById('canvas-after');

            function move(e) {
                const rect = box.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                let pos = (clientX - rect.left) / rect.width;
                pos = Math.max(0.02, Math.min(0.98, pos));

                line.style.left = `${pos * 100}%`;
                cAfter.style.clipPath = `inset(0 0 0 ${pos * 100}%)`;
            }

            box.addEventListener('mousemove', move);
            box.addEventListener('touchmove', move);
        }

        function downloadResult() {
            const cAfter = document.getElementById('canvas-after');
            const a = document.createElement('a');
            a.download = `perfect-smile-${Date.now()}.jpg`;
            a.href = cAfter.toDataURL('image/jpeg', 0.95);
            a.click();
        }

        function restart() {
            showScreen('welcome');
        }
    </script>
</body>
</html>
